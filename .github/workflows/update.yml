name: Update FreeForYoung

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xray
        shell: bash
        run: |
          set -e

          XRAY_VERSION="1.8.24"
          URL="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"

          curl -L --fail --retry 3 "$URL" -o /tmp/xray.zip

          mkdir -p "$HOME/xray"
          unzip -o /tmp/xray.zip -d "$HOME/xray"

          chmod +x "$HOME/xray/xray"

          "$HOME/xray/xray" version

          echo "XRAY_PATH=$HOME/xray/xray" >> "$GITHUB_ENV"

      - name: Run FreeForYoung
        run: |
          python scripts/build_subscription.py

      - name: Commit generated subscription
        shell: bash
        run: |
          git config user.name "FreeForYoung Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update FreeForYoung subscription"
          git push
