name: Update FreeForYoung

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: freeforyoung-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Xray
        shell: bash
        run: |
          set -euo pipefail

          XRAY_VERSION="1.8.24"
          URL="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"

          curl -fL --retry 5 --retry-delay 2 "$URL" -o /tmp/xray.zip

          rm -rf "$HOME/xray"
          mkdir -p "$HOME/xray"

          unzip -q -o /tmp/xray.zip -d "$HOME/xray"
          chmod +x "$HOME/xray/xray"

          "$HOME/xray/xray" version

          echo "XRAY_PATH=$HOME/xray/xray" >> "$GITHUB_ENV"

      - name: Build subscription
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_subscription.py

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail

          test -s output/subscription.txt
          test -s output/servers.txt
          test -s output/stats.json

          echo "================================"
          echo "Generated files"
          echo "================================"

          ls -lh output/

          echo
          echo "================================"
          echo "Stats"
          echo "================================"

          cat output/stats.json

      - name: Commit generated subscription
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FreeForYoung Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update FreeForYoung subscription"
          git push
